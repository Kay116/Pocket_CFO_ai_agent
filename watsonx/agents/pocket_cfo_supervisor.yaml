  is_default_prompts: false
  prompts:
    - id: prompt1
      title: Help me understand my monthly spending
      subtitle: ""
      prompt: Help me understand my monthly spending
      state: active
    - id: prompt2
      title: Help me make a monthly budget from the information I provide
      subtitle: ""
      prompt: Help me make a monthly budget from the information I provide
      state: active
    - id: prompt3
      title: Help me plan to pay down debt
      subtitle: ""
      prompt: Help me plan to pay down debt
      state: active
    - id: prompt4
      title: Monthly check-in
      subtitle: ""
      prompt: Let's do my monthly check-in
      state: active
welcome_content:
  welcome_message: Hi, I'm Pocket CFO
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
